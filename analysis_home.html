    <!-- ================= 模块三：核心逻辑层 (Search & API) (保持不变) ================= -->
    <script>
        window.TCMLogic = {
            // 您的 Gemini Key
            apiKey: "AIzaSyBvLoh6DDNIe9uQxQwage8zXkc9BF5-1-M",

            /**
             * 1. 模糊匹配搜索算法
             * 不要求完全匹配，而是基于关键词积分
             */
            searchLocalDB: (query) => {
                const db = window.TCM_DATABASE;
                if (!db) return null;
                
                // 1. 预处理输入：去除标点，拆分为关键词数组
                // 例如 "头晕，目眩" -> ["头晕", "目眩"]
                const keywords = query.replace(/[，。？！,?!.;；：:]/g, ' ').split(/\s+/).filter(k => k.length > 0);
                
                if (keywords.length === 0) return null;

                let bestMatch = null;
                let maxScore = 0;

                // 2. 扁平化所有证型，方便统一遍历
                const getAllPatterns = () => {
                    let patterns = [];
                    // 八纲
                    if (db.eightPrinciples) {
                        Object.values(db.eightPrinciples).forEach(arr => patterns = patterns.concat(arr.map(p => ({...p, source: '八纲'}))));
                    }
                    // 病性 (六淫、气血、津液)
                    if (db.nature) {
                        if(db.nature.sixEvils) patterns = patterns.concat(db.nature.sixEvils.map(p => ({...p, source: '六淫'})));
                        if(db.nature.bodyFluids) patterns = patterns.concat(db.nature.bodyFluids.map(p => ({...p, source: '津液'})));
                        if(db.nature.qiBlood) {
                             if(db.nature.qiBlood.qi) patterns = patterns.concat(db.nature.qiBlood.qi.map(p => ({...p, source: '气血'})));
                             if(db.nature.qiBlood.blood) patterns = patterns.concat(db.nature.qiBlood.blood.map(p => ({...p, source: '气血'})));
                             if(db.nature.qiBlood.combined) patterns = patterns.concat(db.nature.qiBlood.combined.map(p => ({...p, source: '气血'})));
                        }
                    }
                    // 脏腑
                    if (db.zangFu) {
                        Object.values(db.zangFu).forEach(arr => patterns = patterns.concat(arr.map(p => ({...p, source: '脏腑'}))));
                    }
                    return patterns;
                };

                // 3. 评分逻辑
                getAllPatterns().forEach(p => {
                    let score = 0;
                    // 获取各字段内容，转小写方便匹配
                    const name = (p.name || "").toLowerCase();
                    const symptoms = (p.symptoms || "").toLowerCase();
                    const keyPoints = (p.keyPoints || "").toLowerCase();
                    const definition = (p.definition || "").toLowerCase();
                    
                    // 规则 A: 证型名称直接包含输入中的完整词汇 (权重极高)
                    // 例如输入 "心阳虚"，正好有个证型叫 "心阳虚证"
                    if (name.includes(query)) score += 50;

                    // 规则 B: 关键词逐个匹配 (积分制)
                    keywords.forEach(kw => {
                        // 证型名字里有关键词 (如 "心" 或 "阳虚") -> +10分
                        if (name.includes(kw)) score += 10;
                        // 辨证要点里有关键词 -> +5分
                        if (keyPoints.includes(kw)) score += 5;
                        // 症状描述里有关键词 -> +2分
                        if (symptoms.includes(kw)) score += 2;
                        // 定义里有关键词 -> +1分
                        if (definition.includes(kw)) score += 1;
                    });

                    // 更新最佳匹配
                    if (score > maxScore) { 
                        maxScore = score; 
                        bestMatch = p; 
                    }
                });

                // 4. 设定一个最低门槛，避免太离谱的匹配 (例如至少要匹配到一个重要关键词，分数>5)
                return maxScore >= 5 ? bestMatch : null;
            },

            // 2. 格式化本地结果 (修改版：自动关联 database2.js 的深度调理建议)
            formatLocalResult: (pattern) => {
                // 1. 清理名称 (移除数字前缀，如 "1. 心血虚证" -> "心血虚证")
                const cleanName = pattern.name.replace(/^\d+\.\s*/, '').trim();

                // 2. 在新数据库中查找匹配项
                let imperialMatch = null;
                if (window.TCM_IMPERIAL_DATABASE) {
                    for (const chapter of window.TCM_IMPERIAL_DATABASE) {
                        // 尝试完全匹配名称
                        const found = chapter.syndromes.find(s => s.name === cleanName);
                        if (found) {
                            imperialMatch = found;
                            break;
                        }
                        // 尝试部分匹配 (处理兼证名称不完全一致的情况)
                        const partialFound = chapter.syndromes.find(s => cleanName.includes(s.name) || s.name.includes(cleanName));
                         if (partialFound && !imperialMatch) {
                            imperialMatch = partialFound;
                        }
                    }
                }

                let response = `【辨证结论】\n辨证方法：${pattern.source || '本地知识库'} (本地快速匹配)\n证型诊断：${pattern.name}\n`;
                
                // 如果找到新数据库的匹配，添加比喻
                if (imperialMatch && imperialMatch.metaphor) {
                     response += `通俗比喻：${imperialMatch.metaphor}\n`;
                }

                response += `\n【证候表现】\n${pattern.symptoms}\n\n【证候分析】\n${pattern.mechanism || pattern.definition || "详见教材。"}\n`;
                
                if (imperialMatch && imperialMatch.pathology && imperialMatch.pathology.crisis) {
                    response += `(深度解析：${imperialMatch.pathology.crisis})\n`;
                }

                response += `\n【辨证要点】\n${pattern.keyPoints || "无"}\n\n【调理建议】\n`;

                // === 关键修改：优先使用 database2.js 的调理建议 ===
                if (imperialMatch && imperialMatch.management) {
                    const m = imperialMatch.management;
                    response += `★ 总体策略：${m.strategy}\n`;
                    
                    if (m.diet) {
                        response += `\n[饮食调理]\n`;
                        if (m.diet.principle) response += `原则：${m.diet.principle}\n`;
                        if (m.diet.ingredients) response += `推荐食材：${m.diet.ingredients.join('、')}\n`;
                        if (m.diet.recipes && m.diet.recipes.length > 0) {
                            response += `推荐食谱：\n`;
                            m.diet.recipes.forEach(r => {
                                response += `  • ${r.name}：${r.details}\n`;
                            });
                        }
                        if (m.diet.note) response += `注意：${m.diet.note}\n`;
                    }

                    if (m.lifestyle) {
                        response += `\n[生活起居]\n${m.lifestyle}\n`;
                    }

                    if (m.emotion) {
                        response += `\n[情志调节]\n${m.emotion}\n`;
                    }

                    if (m.acupoints) {
                        response += `\n[穴位保健]\n`;
                        m.acupoints.forEach(a => {
                            response += `  • ${a.name}：${a.method}\n`;
                        });
                    }

                    if (m.taboos) {
                         response += `\n[禁忌]\n${m.taboos}\n`;
                    }
                } else {
                    // 兜底：如果没有找到详细数据
                    response += `建议参考相关方剂，注意饮食清淡，起居有常（如需用药请咨询医师）。`;
                }

                return response;
            },

            // 3. 模拟回复 (API 失败时兜底)
            generateMockResponse: (input) => {
                return `【辨证结论】\n辨证方法：智能推断 (模拟)\n证型诊断：气血亏虚证（倾向）\n\n【证候表现】\n神疲乏力，少气懒言。\n\n【分析】\n(注：未能连接到云端 AI，且本地库无匹配，显示模拟结果。请检查网络连接或 API Key 是否有效。)`;
            },

            // 4. 调用 Gemini API (云端)
            fetchGemini: async (input, customKey) => {
                // 优先使用传入的 Key，如果没有则使用默认 Key
                const key = customKey || window.TCMLogic.apiKey;
                console.log("正在尝试连接 Gemini API...");
                
                try {
                    // 使用 gemini-1.5-flash 模型
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ 
                                parts: [{ 
                                    text: "你是一位精通中医临床的专家AI。请严格按照以下格式输出：\n【辨证结论】\n【证候表现】\n【证候分析】\n【辨证要点】\n【调理建议】\n\n用户主诉：" + input 
                                }] 
                            }]
                        })
                    });
                    
                    if (!response.ok) {
                        const errData = await response.json();
                        console.error("API Error Details:", errData);
                        throw new Error(`HTTP Error: ${response.status} - ${errData.error?.message || response.statusText}`);
                    }

                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content) {
                        return data.candidates[0].content.parts[0].text;
                    }
                    throw new Error("Invalid response structure from Gemini");
                } catch (error) {
                    console.error("Gemini Connection Failed:", error);
                    return window.TCMLogic.generateMockResponse(input);
                }
            }
        };
    </script>

        // --- 2. 辅助组件 ---
        function TypewriterEffect({ text }) {
            const [displayed, setDisplayed] = useState('');
            useEffect(() => {
                let i = 0;
                setDisplayed('');
                const timer = setInterval(() => {
                    if (i < text.length) { setDisplayed(prev => prev + text.charAt(i)); i++; }
                    else clearInterval(timer);
                }, 10);
                return () => clearInterval(timer);
            }, [text]);
            return <span>{displayed}</span>;
        }

        // --- 3. 首页组件 (HomeApp) ---
        function HomeApp({ onNavigate }) {
            // *** 修改：初始化状态时优先读取 localStorage ***
            const [question, setQuestion] = useState(localStorage.getItem('tcm_query') || '');
            const [isListening, setIsListening] = useState(false);
            const [currentExample, setCurrentExample] = useState('');
            const [redirecting, setRedirecting] = useState(false);

                // *** 修改：只有当没有预存内容时才刷新示例 ***
                if (!question) {
                    refreshExample(); 
                }
            }, []);

            const refreshExample = () => {
                let next = allExamples[Math.floor(Math.random() * allExamples.length)];
                while (next === currentExample && allExamples.length > 1) next = allExamples[Math.floor(Math.random() * allExamples.length)];
                setCurrentExample(next);
            };

            // 语音输入
            const handleVoiceInput = () => {
                if (isListening) {
                    setIsListening(false);
                    if (window.speechRecognitionInstance) window.speechRecognitionInstance.stop();
                    return;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { alert("您的浏览器暂不支持语音输入。"); return; }
                const recognition = new SpeechRecognition();
                recognition.lang = 'zh-CN';
                recognition.onstart = () => setIsListening(true);
                recognition.onresult = (e) => {
                    const newText = question + e.results[0][0].transcript;
                    setQuestion(newText);
                    // *** 建议：实时保存（可选，但为了更好的体验，这里不强制，只在提交保存）***
                    setIsListening(false);
                };
                recognition.onerror = () => setIsListening(false);
                recognition.onend = () => setIsListening(false);
                window.speechRecognitionInstance = recognition;
                recognition.start();
            };

            // 逻辑：保存数据并切换视图 (取代了原来的 window.location.href)
            const handleStartAnalysis = () => {
                if (!question.trim()) return;
                
                // 1. 保存数据到 localStorage (为了兼容 ResultApp 的读取逻辑)

                // 2. 更新状态显示“正在分析”
                setRedirecting(true);
                
                // 3. 延迟执行视图切换
                setTimeout(() => {
                   onNavigate('result'); // 切换到结果视图

        // --- 4. 结果页组件 (ResultApp) ---
        function ResultApp({ onNavigate }) {
            const [status, setStatus] = useState('loading');
            const [answer, setAnswer] = useState('');
            const [source, setSource] = useState(''); // 'local' 或 'api'
            const [showSettings, setShowSettings] = useState(false);
            const [apiKey, setApiKey] = useState(window.TCMLogic.apiKey);
            const [query, setQuery] = useState('');

            useEffect(() => {
                // 1. 从 localStorage 获取问题 (兼容原逻辑)
                const q = localStorage.getItem('tcm_query');
                setQuery(q);
                
                if (!q) return;

                const analyze = async () => {
                    console.log("分析开始: ", q);
                    
                    // 2. 优先：本地数据库搜索 (模糊匹配)
                    const localRes = window.TCMLogic.searchLocalDB(q);
                    
                    if (localRes) {
                        console.log("命中本地数据库:", localRes.name);
                        await new Promise(r => setTimeout(r, 800)); // 模拟思考
                        setAnswer(window.TCMLogic.formatLocalResult(localRes));
                        setSource('local');
                        setStatus('result');
                        return; // *** 关键：如果本地找到了，直接结束，不连接 API ***
                    }

                    // 3. 兜底：云端 Gemini API
                    console.log("本地无结果，调用 Gemini API");
                    const apiRes = await window.TCMLogic.fetchGemini(q, apiKey);
                    setAnswer(apiRes);
                    setSource('api');
                    setStatus('result');
                };

                analyze();
            }, []);

            const updateKey = (e) => {
                const newKey = e.target.value;
                setApiKey(newKey);
                window.TCMLogic.apiKey = newKey; // 更新全局 Key
            };

            if (!query) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center text-stone-500">
                        <p className="mb-4">未找到分析内容。</p>
                        <button onClick={() => onNavigate('home')} className="text-blue-600 underline">返回首页</button>
                    </div>
                );
            }

            return (
                <div className="min-h-screen w-full bg-[#fcfbf9] text-[#4a4a4a] p-4 sm:p-8 flex flex-col items-center">
                    
                    {/* 设置按钮 */}
                    <div className="absolute top-4 right-4 z-50">
                        <button onClick={() => setShowSettings(!showSettings)} className="text-stone-400 hover:text-stone-600 p-2"><Icons.Settings /></button>
                        {showSettings && (
                            <div className="absolute top-10 right-0 bg-white p-4 shadow-lg rounded-lg border border-stone-200 w-72 animate-fade-in">
                                <label className="text-xs font-bold text-stone-500 block mb-2">Gemini API Key</label>
                                <input type="password" value={apiKey} onChange={updateKey} className="w-full text-xs border p-2 rounded bg-stone-50 outline-none focus:border-stone-400 mb-2"/>
                            </div>
                        )}
                    </div>

                    {status === 'loading' && (
                        <div className="mt-32 flex flex-col items-center animate-fade-in">
                            <div className="relative w-32 h-32 flex items-center justify-center mb-8">
                                <div className="absolute inset-0 border-2 border-stone-200 rounded-full animate-ping opacity-20"></div>
                                <div className="absolute inset-2 border border-stone-300 rounded-full animate-[spin_3s_linear_infinite]"></div>
                                <div className="absolute inset-0 bg-gradient-to-tr from-stone-100 to-white rounded-full shadow-inner flex items-center justify-center"><span className="font-serif text-2xl text-stone-600 animate-pulse">辨</span></div>
                            </div>
                            <p className="text-stone-500">正在分析病案...</p>
                        </div>
                    )}

                    {status === 'result' && (
                        <div className="w-full max-w-2xl animate-fade-in pb-20 mt-10">
                            <div className="mb-8 flex items-center justify-between">
                                <div className="flex items-center space-x-2 text-stone-400">
                                    <div className={`w-2 h-2 rounded-full ${source==='local'?'bg-green-400':'bg-blue-400'}`}></div>
                                    <span className="text-sm font-medium tracking-widest uppercase">
                                        {source === 'local' ? 'Local DB Result' : 'Gemini AI Result'}
                                    </span>
                                </div>
                                <button onClick={() => onNavigate('home')} className="flex items-center space-x-1 text-stone-400 hover:text-stone-800 transition-colors px-2 py-1">
                                    <Icons.ArrowLeft /><span className="text-sm">返回编辑</span>
                                </button>
                            </div>

                            <div className="prose prose-stone prose-lg max-w-none bg-white p-8 rounded-2xl shadow-sm border border-stone-100">
                                {source === 'local' && <div className="mb-6 bg-green-50 border border-green-100 text-green-700 px-4 py-2 rounded-lg flex items-center space-x-2 text-sm"><Icons.Check /><span>已从本地数据库找到精确匹配。</span></div>}
                                
                                <div className="text-stone-800 leading-relaxed whitespace-pre-line font-serif min-h-[100px]">
                                    <TypewriterEffect text={answer} />
                                </div>
                            </div>

                            <div className="mt-8 flex justify-center text-stone-300 text-xs flex items-center gap-1">
                                <Icons.Sparkles /> <span>Generated by TCM Assistant</span>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 5. 主程序 (MainApp) ---
        function MainApp() {
            // 管理视图状态：'home' 或 'result'
            const [view, setView] = useState('home');

            return (
                <React.Fragment>
                    {view === 'home' ? (
                        <HomeApp onNavigate={setView} />
                    ) : (
                        <ResultApp onNavigate={setView} />
                    )}
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
